name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: de
          POSTGRES_PASSWORD: de
          POSTGRES_DB: de_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U de -d de_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+asyncpg://de:de@localhost:5432/de_test
      TEST_DATABASE_URL: postgresql+asyncpg://de:de@localhost:5432/de_test
      APP_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - name: Alembic upgrade on empty database
        run: uv run alembic upgrade head
      - name: Tests with coverage
        run: uv run pytest -q --cov=app --cov-report=term-missing
      - name: Dependency audit
        run: uv run pip-audit

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: decision-engine-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
