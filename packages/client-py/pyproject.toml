[project]
name = "decision-engine-client"
version = "0.1.0"
description = "Python client for the Decision Engine /v1 API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27", "attrs>=23.2", "python-dateutil>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/decision_engine_client"]
