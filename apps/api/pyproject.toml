[project]
name = "decision-engine-api"
version = "0.1.0"
description = "Decision Engine API and workers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "pydantic>=2",
  "pydantic-settings",
  "sqlalchemy[asyncio]>=2",
  "asyncpg",
  "alembic",
  "pgvector",
  "uuid6",
  "httpx",
  "redis>=5",
  "litellm==1.104.0",
  "pyyaml",
  "jsonschema",
  "referencing",
  "cryptography",
]

[dependency-groups]
dev = [
  "pytest",
  "pytest-asyncio",
  "pytest-cov",
  "respx",
  "ruff",
  "mypy",
  "types-PyYAML",
  "types-jsonschema",
  "pre-commit",
  "pip-audit",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID", "S", "ASYNC"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# One LLM door (CLAUDE.md): provider SDKs only under app/llm.
"litellm".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"openai".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"anthropic".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"google.genai".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"google.generativeai".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"groq".msg = "Import LLM providers only under app/llm (use llm.gateway)."
"cerebras".msg = "Import LLM providers only under app/llm (use llm.gateway)."

[tool.ruff.lint.per-file-ignores]
"app/llm/**" = ["TID251"]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.core.*", "app.security.*", "app.llm.*", "app.triage.*"]
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: needs a reachable Postgres (TEST_DATABASE_URL)",
  "slow: slow tests",
]
